services:
  postgres:
    image: postgres:alpine3.22
    restart: unless-stopped
    environment:
      #TODO should use env for real credentials
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d yt_clone" ]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./yt-clone-authservice
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_service
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./yt-clone-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/yt_clone
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
